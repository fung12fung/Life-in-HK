<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港生活測驗 — Life in HK Test</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans HK', 'PingFang HK', 'Microsoft JhengHei', system-ui, sans-serif;
  background: #f4f6fa;
  color: #222;
  min-height: 100vh;
}

.site-header {
  background: #8B0000;
  color: #fff;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  height: 64px;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.site-header .logo { width: 40px; height: 40px; flex-shrink: 0; }
.site-header .hdr-text h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: .02em; }
.site-header .hdr-text p  { font-size: .8rem; opacity: .8; margin-top: 2px; }

.container { max-width: 780px; margin: 0 auto; padding: 28px 20px 60px; }

.screen { display: none; }
.screen.active { display: block; }

.card {
  background: #fff;
  border-radius: 12px;
  padding: 36px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
}

.start-card { text-align: center; }
.start-card h2 { font-size: 1.9rem; color: #8B0000; margin-bottom: 10px; }
.start-card .sub { color: #555; font-size: .95rem; margin-bottom: 28px; line-height: 1.6; }

.info-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin: 24px 0;
}
.info-box {
  background: #fff5f5;
  border: 1px solid #f5c0c0;
  border-radius: 10px;
  padding: 18px 10px;
}
.info-box .num { font-size: 2rem; font-weight: 700; color: #8B0000; }
.info-box .lbl { font-size: .8rem; color: #666; margin-top: 4px; }

.note { color: #555; font-size: .88rem; margin-bottom: 28px; }
.note strong { color: #8B0000; }

.btn-start {
  background: #8B0000;
  color: #fff;
  border: none;
  padding: 16px 52px;
  font-size: 1.05rem;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  transition: background .2s;
  letter-spacing: .03em;
}
.btn-start:hover { background: #a00000; }

.quiz-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.q-counter { font-size: .9rem; color: #555; font-weight: 500; }
.timer {
  background: #8B0000;
  color: #fff;
  padding: 5px 14px;
  border-radius: 20px;
  font-size: .9rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  min-width: 68px;
  text-align: center;
  transition: background .3s;
}
.timer.warn { background: #c0392b; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }

.progress-wrap {
  background: #e8e8e8;
  border-radius: 4px;
  height: 6px;
  margin-bottom: 22px;
  overflow: hidden;
}
.progress-fill {
  background: #8B0000;
  height: 100%;
  border-radius: 4px;
  transition: width .35s ease;
}

.q-card { margin-bottom: 20px; }

.q-type-badge {
  display: inline-block;
  background: #ffeaea;
  color: #8B0000;
  font-size: .78rem;
  font-weight: 600;
  padding: 3px 11px;
  border-radius: 20px;
  margin-bottom: 14px;
  letter-spacing: .02em;
}

.q-text {
  font-size: 1.1rem;
  font-weight: 600;
  color: #111;
  line-height: 1.55;
  margin-bottom: 22px;
}

.options-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }

.opt-item label {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 13px 16px;
  border: 2px solid #ddd;
  border-radius: 8px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  font-size: .95rem;
  line-height: 1.45;
  user-select: none;
}
.opt-item label:hover { border-color: #8B0000; background: #fff5f5; }
.opt-item input[type=radio],
.opt-item input[type=checkbox] {
  margin-top: 2px;
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  accent-color: #8B0000;
  cursor: pointer;
}
.opt-item.sel label { border-color: #8B0000; background: #ffeaea; }

.nav-row {
  display: flex;
  gap: 12px;
  align-items: center;
}
.btn-nav {
  background: #fff;
  color: #8B0000;
  border: 2px solid #8B0000;
  padding: 11px 24px;
  border-radius: 7px;
  cursor: pointer;
  font-size: .95rem;
  font-weight: 600;
  transition: all .15s;
  white-space: nowrap;
}
.btn-nav:hover:not(:disabled) { background: #8B0000; color: #fff; }
.btn-nav:disabled { opacity: .38; cursor: not-allowed; }
.btn-submit {
  background: #1a7a1a;
  color: #fff;
  border: 2px solid #1a7a1a;
  padding: 11px 26px;
  border-radius: 7px;
  cursor: pointer;
  font-size: .95rem;
  font-weight: 700;
  margin-left: auto;
  transition: background .15s;
  white-space: nowrap;
}
.btn-submit:hover { background: #166016; }

.result-card { text-align: center; margin-bottom: 24px; }

.result-badge {
  display: inline-block;
  padding: 10px 36px;
  border-radius: 30px;
  font-size: 1.35rem;
  font-weight: 700;
  margin-bottom: 18px;
}
.result-badge.pass { background: #d4edda; color: #155724; }
.result-badge.fail { background: #f8d7da; color: #721c24; }

.result-score { font-size: 3.2rem; font-weight: 700; color: #8B0000; }
.result-pct { font-size: 1.4rem; font-weight: 600; color: #444; margin-top: 4px; }
.result-msg { font-size: .97rem; color: #555; margin-top: 10px; }

.btn-retry {
  background: #8B0000;
  color: #fff;
  border: none;
  padding: 13px 40px;
  font-size: 1rem;
  border-radius: 7px;
  cursor: pointer;
  font-weight: 700;
  margin-top: 24px;
  transition: background .2s;
}
.btn-retry:hover { background: #a00000; }

.review-section h3 { font-size: 1.15rem; color: #8B0000; margin-bottom: 16px; font-weight: 700; }

.rv-item {
  background: #fff;
  border-radius: 9px;
  padding: 18px 20px;
  margin-bottom: 12px;
  box-shadow: 0 1px 5px rgba(0,0,0,.07);
  border-left: 4px solid transparent;
}
.rv-item.ok   { border-left-color: #28a745; }
.rv-item.bad  { border-left-color: #dc3545; }
.rv-item.skip { border-left-color: #ffc107; }

.rv-num {
  font-size: .78rem;
  color: #999;
  margin-bottom: 5px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.rv-icon { font-size: 1.1rem; }
.rv-q { font-size: .93rem; font-weight: 600; margin-bottom: 10px; color: #222; }
.rv-ans { font-size: .87rem; }
.rv-your { color: #dc3545; }
.rv-your.ok { color: #28a745; }
.rv-correct { color: #28a745; margin-top: 3px; }

@media (max-width: 560px) {
  .card { padding: 24px 18px; }
  .start-card h2 { font-size: 1.5rem; }
  .info-grid { gap: 10px; }
  .info-box .num { font-size: 1.6rem; }
  .q-text { font-size: 1rem; }
  .btn-nav, .btn-submit { padding: 10px 16px; font-size: .88rem; }
}
</style>
</head>
<body>

<header class="site-header">
  <svg class="logo" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="20" r="20" fill="#CE1126"/>
    <g fill="white">
      <ellipse cx="20" cy="10.5" rx="3" ry="6.5" transform="rotate(0,20,20)"/>
      <ellipse cx="20" cy="10.5" rx="3" ry="6.5" transform="rotate(72,20,20)"/>
      <ellipse cx="20" cy="10.5" rx="3" ry="6.5" transform="rotate(144,20,20)"/>
      <ellipse cx="20" cy="10.5" rx="3" ry="6.5" transform="rotate(216,20,20)"/>
      <ellipse cx="20" cy="10.5" rx="3" ry="6.5" transform="rotate(288,20,20)"/>
    </g>
  </svg>
  <div class="hdr-text">
    <h1>香港生活測驗</h1>
    <p>Life in HK Test · 模擬練習</p>
  </div>
</header>

<div class="container">

  <div id="s-start" class="screen active">
    <div class="card start-card">
      <h2>香港生活測驗</h2>
      <p class="sub">
        測試吓你對香港歷史、文化同政府嘅認識<br>
        考完即刻睇成績同埋詳細答案
      </p>
      <div class="info-grid">
        <div class="info-box"><div class="num">23</div><div class="lbl">條題目</div></div>
        <div class="info-box"><div class="num">30</div><div class="lbl">分鐘限時</div></div>
        <div class="info-box"><div class="num">75%</div><div class="lbl">合格線</div></div>
      </div>
      <p class="note">答對 <strong>17 題或以上</strong>即係合格。加油！</p>
      <button class="btn-start" onclick="startTest()">開始測驗 →</button>
    </div>
  </div>

  <div id="s-quiz" class="screen">
    <div class="quiz-meta">
      <span class="q-counter" id="q-counter">第 1 題，共 23 題</span>
      <span class="timer" id="timer">30:00</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-fill" id="prog" style="width:0%"></div>
    </div>
    <div class="card q-card" id="q-card"></div>
    <div class="nav-row">
      <button class="btn-nav" id="btn-prev" onclick="prevQ()">← 上一題</button>
      <button class="btn-nav" id="btn-next" onclick="nextQ()">下一題 →</button>
      <button class="btn-submit" id="btn-submit" onclick="confirmSubmit()" style="display:none">提交測驗 ✓</button>
    </div>
  </div>

  <div id="s-result" class="screen">
    <div class="card result-card">
      <div class="result-badge" id="r-badge">合格</div>
      <div class="result-score" id="r-score">17/23</div>
      <div class="result-pct" id="r-pct">73.9%</div>
      <div class="result-msg" id="r-msg">恭喜你合格！</div>
      <button class="btn-retry" onclick="retryTest()">再試一次 ↺</button>
    </div>
    <div class="review-section">
      <h3>詳細答案回顧</h3>
      <div id="review"></div>
    </div>
  </div>

</div>

<script>
const PASS = 17;
const SECS = 30 * 60;

const Qs = [
  {
    t: '香港係幾時正式成為中國嘅特別行政區？',
    type: 'single',
    opts: ['1997年6月30日', '1997年7月1日', '1997年10月1日', '1999年7月1日'],
    ans: [1]
  },
  {
    t: '香港最高嘅山峰係邊一座？',
    type: 'single',
    opts: ['太平山', '鳳凰山', '大帽山', '馬鞍山'],
    ans: [2]
  },
  {
    t: '以下邊兩種係香港嘅官方語言？（請選兩個）',
    type: 'multi',
    opts: ['中文', '普通話', '英文', '葡萄牙文'],
    ans: [0, 2]
  },
  {
    t: '邊份文件被稱為香港嘅「小憲法」？',
    type: 'single',
    opts: ['中英聯合聲明', '英皇制誥', '基本法', '香港憲章'],
    ans: [2]
  },
  {
    t: '維多利亞港係分隔邊兩個地方？',
    type: 'single',
    opts: ['香港島同大嶼山', '香港島同九龍', '九龍同新界', '大嶼山同九龍'],
    ans: [1]
  },
  {
    t: '香港總共有幾多個區？',
    type: 'single',
    opts: ['14個', '16個', '18個', '22個'],
    ans: [2]
  },
  {
    t: '以下邊一個唔係香港三大地理區域之一？',
    type: 'single',
    opts: ['香港島', '九龍', '澳門', '新界'],
    ans: [2]
  },
  {
    t: '喺「一國兩制」之下，1997年後香港嘅生活方式獲保障幾多年？',
    type: 'single',
    opts: ['25年', '50年', '75年', '99年'],
    ans: [1]
  },
  {
    t: '香港嘅立法機構係叫乜嘢名？',
    type: 'single',
    opts: ['全國人民代表大會', '行政會議', '立法會（LegCo）', '香港議會'],
    ans: [2]
  },
  {
    t: '港鐵（前稱地鐵）係幾年開通第一條路線？',
    type: 'single',
    opts: ['1975年', '1979年', '1982年', '1985年'],
    ans: [1]
  },
  {
    t: '香港國際機場喺邊度？',
    type: 'single',
    opts: ['香港島', '九龍', '青衣島', '大嶼山赤鱲角'],
    ans: [3]
  },
  {
    t: '邊個節日以龍舟競渡著稱，喺農曆五月初五舉行？',
    type: 'single',
    opts: ['天后誕', '中秋節', '端午節', '長洲太平清醮'],
    ans: [2]
  },
  {
    t: '香港股票交易所嘅正式名稱係乜嘢？',
    type: 'single',
    opts: ['亞太交易所', '香港交易及結算所（HKEX）', '華南股票交易所', '珠江交易所'],
    ans: [1]
  },
  {
    t: '誰係香港最後一任英國總督？',
    type: 'single',
    opts: ['麥理浩（Murray MacLehose）', '尤德（Edward Youde）', '衛奕信（David Wilson）', '彭定康（Chris Patten）'],
    ans: [3]
  },
  {
    t: '長洲太平清醮嘅特色包山，係用乜嘢疊成？',
    type: 'single',
    opts: ['月餅', '平安包', '紙紮品', '年糕'],
    ans: [1]
  },
  {
    t: '香港係幾年為北京奧運主辦馬術項目？',
    type: 'single',
    opts: ['2004年', '2006年', '2008年', '2012年'],
    ans: [2]
  },
  {
    t: '香港選民參與選舉嘅最低年齡係幾多歲？',
    type: 'single',
    opts: ['16歲', '18歲', '21歲', '25歲'],
    ans: [1]
  },
  {
    t: '「香港」呢個名嘅英文字面意思係乜嘢？',
    type: 'single',
    opts: ['珍珠港（Pearl Harbour）', '龍港（Dragon Port）', '芬芳港口（Fragrant Harbour）', '翡翠港（Jade Harbour）'],
    ans: [2]
  },
  {
    t: '邊種花出現喺香港區旗上，係香港嘅區花？',
    type: 'single',
    opts: ['蓮花', '櫻花', '梅花', '洋紫荊（Bauhinia）'],
    ans: [3]
  },
  {
    t: '以下邊兩條係連接香港島同九龍嘅與海隧道？（請選兩個）',
    type: 'multi',
    opts: ['香港仔隧道', '紅隧（紅磡方向）', '獅子山隧道', '西隧（西區方向）'],
    ans: [1, 3]
  },
  {
    t: '香港舊有嘅國際機場叫乜嘢名？以飛機掠過市區上空嘅驚險降落馳名全球。',
    type: 'single',
    opts: ['石崗機場', '沙田機場', '啟德機場', '青衣岛機場'],
    ans: [2]
  },
  {
    t: '香港人話「去飲茶」，通常係指去做乜？',
    type: 'single',
    opts: ['去買靚茶葉', '去茶樓食點心', '喺屋企泡功夫茶', '去茶藝班學習'],
    ans: [1]
  },
  {
    t: '香港最長嘅遠足徑叫乜嘢名？全長約100公里，穿越新界。',
    type: 'single',
    opts: ['衛奕信徑', '港島徑', '麥理浩徑', '鳳凰徑'],
    ans: [2]
  }
];

let cur = 0;
let chosen = Qs.map(() => null);
let secs = SECS;
let ticker = null;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startTest() {
  cur = 0;
  chosen = Qs.map(() => null);
  secs = SECS;
  show('s-quiz');
  render();
  clearInterval(ticker);
  ticker = setInterval(() => {
    secs--;
    tickTimer();
    if (secs <= 0) { clearInterval(ticker); submitTest(); }
  }, 1000);
}

function tickTimer() {
  const el = document.getElementById('timer');
  const m = String(Math.floor(secs / 60)).padStart(2, '0');
  const s = String(secs % 60).padStart(2, '0');
  el.textContent = m + ':' + s;
  el.classList.toggle('warn', secs <= 300);
}

function render() {
  const q = Qs[cur];
  const n = Qs.length;
  const isMulti = q.type === 'multi';
  const saved = chosen[cur];

  document.getElementById('q-counter').textContent =
    '第 ' + (cur + 1) + ' 題，共 ' + n + ' 題';
  document.getElementById('prog').style.width = ((cur + 1) / n * 100) + '%';

  const prev = document.getElementById('btn-prev');
  const next = document.getElementById('btn-next');
  const sub  = document.getElementById('btn-submit');
  prev.disabled = cur === 0;
  const isLast = cur === n - 1;
  next.style.display = isLast ? 'none' : 'inline-block';
  sub.style.display  = isLast ? 'inline-block' : 'none';

  const optHTML = q.opts.map((o, i) => {
    const inputType = isMulti ? 'checkbox' : 'radio';
    const isSel = saved !== null
      ? (isMulti ? saved.includes(i) : saved === i)
      : false;
    return '<li class="opt-item' + (isSel ? ' sel' : '') + '" id="oi' + i + '">' +
      '<label>' +
      '<input type="' + inputType + '" name="q" value="' + i + '"' +
      (isSel ? ' checked' : '') + ' onchange="pick(' + i + ')">' +
      o + '</label></li>';
  }).join('');

  document.getElementById('q-card').innerHTML =
    '<div class="q-type-badge">' +
    (isMulti ? '☑ 選兩個答案' : '◉ 選一個答案') +
    '</div><div class="q-text">' + q.t + '</div>' +
    '<ul class="options-list">' + optHTML + '</ul>';
}

function pick(i) {
  const q = Qs[cur];
  if (q.type === 'single') {
    chosen[cur] = i;
    document.querySelectorAll('.opt-item').forEach((el, idx) => {
      el.classList.toggle('sel', idx === i);
    });
  } else {
    const cbs = Array.from(document.querySelectorAll('input[name=q]'));
    const sel = cbs.reduce((acc, cb, idx) => { if (cb.checked) acc.push(idx); return acc; }, []);
    if (sel.length > 2) {
      document.querySelector('input[name=q][value="' + i + '"]').checked = false;
      return;
    }
    chosen[cur] = sel.length ? sel : null;
    document.querySelectorAll('.opt-item').forEach((el, idx) => {
      el.classList.toggle('sel', sel.includes(idx));
    });
  }
}

function nextQ() { if (cur < Qs.length - 1) { cur++; render(); } }
function prevQ() { if (cur > 0) { cur--; render(); } }

function confirmSubmit() {
  const unanswered = chosen.filter(a => a === null).length;
  if (unanswered > 0) {
    if (!confirm('仲有 ' + unanswered + ' 題未答。確定提交？')) return;
  }
  submitTest();
}

function submitTest() {
  clearInterval(ticker);
  let score = 0;
  Qs.forEach((q, i) => {
    const a = chosen[i];
    if (a === null) return;
    if (q.type === 'single') {
      if (a === q.ans[0]) score++;
    } else {
      if (JSON.stringify([...a].sort()) === JSON.stringify([...q.ans].sort())) score++;
    }
  });

  const pct = Math.round(score / Qs.length * 100);
  const pass = score >= PASS;

  const badge = document.getElementById('r-badge');
  badge.textContent = pass ? '✓ 合格！' : '✗ 唔合格';
  badge.className = 'result-badge ' + (pass ? 'pass' : 'fail');
  document.getElementById('r-score').textContent = score + ' / ' + Qs.length;
  document.getElementById('r-pct').textContent = pct + '%';
  document.getElementById('r-msg').textContent = pass
    ? '恭喜你！繼續保持。'
    : '今次差少少！需要答對 ' + PASS + ' 題或以上先合格，加油！';

  const revHTML = Qs.map((q, i) => {
    const a = chosen[i];
    let ok = false;
    if (a !== null) {
      ok = q.type === 'single'
        ? a === q.ans[0]
        : JSON.stringify([...a].sort()) === JSON.stringify([...q.ans].sort());
    }
    const cls = a === null ? 'skip' : (ok ? 'ok' : 'bad');
    const icon = a === null ? '—' : (ok ? '✓' : '✗');
    const correctTxt = q.ans.map(ci => q.opts[ci]).join(' 及 ');
    let yourTxt = '未作答';
    if (a !== null) {
      yourTxt = q.type === 'single' ? q.opts[a] : a.map(ai => q.opts[ai]).join(' 及 ');
    }
    return '<div class="rv-item ' + cls + '">' +
      '<div class="rv-num"><span>第 ' + (i + 1) + ' 題</span>' +
      '<span class="rv-icon">' + icon + '</span></div>' +
      '<div class="rv-q">' + q.t + '</div>' +
      '<div class="rv-ans">' +
      '<div class="rv-your' + (ok ? ' ok' : '') + '">你嘅答案：' + yourTxt + '</div>' +
      (!ok ? '<div class="rv-correct">正確答案：' + correctTxt + '</div>' : '') +
      '</div></div>';
  }).join('');

  document.getElementById('review').innerHTML = revHTML;
  show('s-result');
  window.scrollTo(0, 0);
}

function retryTest() { show('s-start'); }
</script>
</body>
</html>
