<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港生活測驗 — Life in HK Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans HK','PingFang HK','Microsoft JhengHei',system-ui,sans-serif;background:#f4f6fa;color:#222;min-height:100vh;}
.hdr{background:#8B0000;color:#fff;padding:0 20px;display:flex;align-items:center;gap:14px;height:68px;box-shadow:0 2px 8px rgba(0,0,0,.28);}
.hdr svg{width:44px;height:44px;flex-shrink:0;}
.hdr h1{font-size:1.2rem;font-weight:700;}
.hdr p{font-size:.82rem;opacity:.82;margin-top:3px;}
.wrap{max-width:820px;margin:0 auto;padding:52px 20px 80px;}
.hero{text-align:center;margin-bottom:42px;}
.hero h2{font-size:1.9rem;font-weight:700;margin-bottom:10px;}
.hero p{color:#666;font-size:.97rem;line-height:1.65;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
.card{background:#fff;border-radius:14px;padding:30px 26px;box-shadow:0 2px 16px rgba(0,0,0,.09);display:flex;flex-direction:column;gap:14px;transition:transform .18s,box-shadow .18s;text-decoration:none;color:inherit;}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 28px rgba(0,0,0,.14);}
.t1{border-top:5px solid #8B0000;}
.t2{border-top:5px solid #1a4a1a;}
.chip{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 13px;border-radius:20px;width:fit-content;}
.t1 .chip{background:#ffeaea;color:#8B0000;}
.t2 .chip{background:#e8f5e8;color:#1a4a1a;}
.card h3{font-size:1.25rem;font-weight:700;}
.t1 h3{color:#8B0000;}.t2 h3{color:#1a4a1a;}
.card .desc{color:#666;font-size:.92rem;line-height:1.6;flex:1;}
.stats{display:flex;gap:20px;}
.stat .n{font-size:1.35rem;font-weight:700;}
.t1 .stat .n{color:#8B0000;}.t2 .stat .n{color:#1a4a1a;}
.stat .l{font-size:.73rem;color:#999;}
.btn{display:block;text-align:center;padding:13px;border-radius:8px;font-weight:700;font-size:.97rem;color:#fff;}
.t1 .btn{background:#8B0000;}.t1 .btn:hover{background:#a00000;}
.t2 .btn{background:#1a4a1a;}.t2 .btn:hover{background:#2a6a2a;}
@media(max-width:540px){.grid{grid-template-columns:1fr;}.hero h2{font-size:1.55rem;}}
</style>
</head>
<body>
<header class="hdr">
  <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
    <circle cx="22" cy="22" r="22" fill="#CE1126"/>
    <g fill="white">
      <ellipse cx="22" cy="11" rx="3.2" ry="7" transform="rotate(0,22,22)"/>
      <ellipse cx="22" cy="11" rx="3.2" ry="7" transform="rotate(72,22,22)"/>
      <ellipse cx="22" cy="11" rx="3.2" ry="7" transform="rotate(144,22,22)"/>
      <ellipse cx="22" cy="11" rx="3.2" ry="7" transform="rotate(216,22,22)"/>
      <ellipse cx="22" cy="11" rx="3.2" ry="7" transform="rotate(288,22,22)"/>
    </g>
  </svg>
  <div><h1>香港生活測驗</h1><p>Life in HK Test · 你識幾多？</p></div>
</header>
<div class="wrap">
  <div class="hero">
    <h2>揀一個測驗開始 ↓</h2>
    <p>兩個主題，各有 23 題，30 分鐘限時。<br>做錯有解釋同埋相關圖片，學完再嚟過。</p>
  </div>
  <div class="grid">
    <a class="card t1" href="test1.html">
      <span class="chip">Test 1</span>
      <h3>歷史政府篇</h3>
      <p class="desc">考考你對香港歷史、政府制度、地理同傳統嘅認識。係香港人就唔應該唔識！</p>
      <div class="stats">
        <div class="stat"><div class="n">23</div><div class="l">題目</div></div>
        <div class="stat"><div class="n">30</div><div class="l">分鐘</div></div>
        <div class="stat"><div class="n">75%</div><div class="l">合格線</div></div>
      </div>
      <div class="btn">開始 Test 1 →</div>
    </a>
    <a class="card t2" href="test2.html">
      <span class="chip">Test 2</span>
      <h3>文化常識篇</h3>
      <p class="desc">花名、食物、流行文化、懷舊人物……識唔識先？呢啲先係真正嘅香港知識！</p>
      <div class="stats">
        <div class="stat"><div class="n">23</div><div class="l">題目</div></div>
        <div class="stat"><div class="n">30</div><div class="l">分鐘</div></div>
        <div class="stat"><div class="n">75%</div><div class="l">合格線</div></div>
      </div>
      <div class="btn">開始 Test 2 →</div>
    </a>
  </div>
</div>
</body>
</html>
